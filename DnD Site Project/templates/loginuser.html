{% extends "Main Template.html" %}
{% block body %}
<form method="POST" action="/create">
    {% if error == 'User' %}
        Wrong username<br>
    {% elif error == 'Password' %}
        Wrong password<br>
    {% endif %}
    username: <input type="text" name="username"><br>
    password: <input type="password" name="password"><br>
    <input type="submit" value="Login"><br>
</form>
{% endblock %}
